name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt / clippy / test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Build check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and offline integration tests
        run: cargo test --locked
      - name: Real subprocess interruption recovery regression
        run: cargo test --locked --lib workspace_patch::tests::process_kill_during_workspace_apply_keeps_recovery_evidence -- --ignored --exact
      - name: Stabilization stress (20 parallel + 20 serial runs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('parallel', 'serial')) {
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              Write-Host ("[STRESS] {0}: {1}/20" -f $mode, $attempt)
              if ($mode -eq 'parallel') {
                cargo test --locked --test stabilization_flow -- --test-threads=4
              } else {
                cargo test --locked --test stabilization_flow -- --test-threads=1
              }
              if ($LASTEXITCODE -ne 0) {
                throw ("stabilization_flow failed in {0} run {1}/20 (exit code: {2})" -f $mode, $attempt, $LASTEXITCODE)
              }
            }
          }

  linux-check:
    name: fmt / clippy / test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Build check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and offline integration tests
        run: cargo test --locked
      - name: Real subprocess interruption recovery regression
        run: cargo test --locked --lib workspace_patch::tests::process_kill_during_workspace_apply_keeps_recovery_evidence -- --ignored --exact
