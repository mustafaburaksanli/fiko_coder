name: Rust CI (Windows, Linux, macOS)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cross-platform:
    name: Rust CI (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            python: python
          - name: Linux
            runner: ubuntu-latest
            python: python3
          - name: macOS Intel x86_64
            runner: macos-15-intel
            python: python3
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon arm64
            runner: macos-15
            python: python3
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify native macOS architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          uname -a
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Build check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and offline integration tests
        run: cargo test --locked
      - name: Discover and audit normal plus opt-in Rust tests
        run: ${{ matrix.python }} scripts/test_inventory.py --output test-inventory.json
      - name: All shared process-interruption recovery regressions
        run: ${{ matrix.python }} scripts/ci_regressions.py ignored
      - name: Live-Qwen acceptance script offline smoke (no model or approvals)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path ([System.IO.Path]::GetTempPath()) ('fiko_live_' + [guid]::NewGuid().ToString('N').Substring(0,8))
          & ./scripts/live_qwen_acceptance.ps1 -Mode prepare -FixtureDir $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance fixture setup failed' }
          $math = Join-Path $fixture 'src/math.rs'
          $newline = [Environment]::NewLine
          $add = $newline + 'pub fn quintuple(n: i32) -> i32 { n * 5 }' + $newline
          $add += '#[test] fn test_quintuple() { assert_eq!(quintuple(3), 15); }' + $newline
          [System.IO.File]::AppendAllText($math, $add)
          & ./scripts/live_qwen_acceptance.ps1 -Mode evaluate -FixtureDir $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance measurement positive fixture failed' }
          $result = Get-Content -LiteralPath ($fixture + '.result.json') -Raw | ConvertFrom-Json
          if ($result.pass -ne $true) { throw 'Acceptance result must be successful' }
      - name: Stabilization stress (20 parallel + 20 serial runs)
        run: ${{ matrix.python }} scripts/ci_regressions.py stress --repeats 20
