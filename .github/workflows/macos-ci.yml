name: macOS Rust compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Rust CI (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Intel x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: Apple Silicon arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          uname -a
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Build check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and offline integration tests
        run: cargo test --locked
      - name: Real process interruption recovery regression
        run: cargo test --locked --lib workspace_patch::tests::process_kill_during_workspace_apply_keeps_recovery_evidence -- --ignored --exact
      - name: Restore subprocess approved resume regression
        run: cargo test --locked --lib workspace_recovery::tests::restore_parent_kills_child_and_resumes -- --ignored --exact
      - name: Staged restore interruption before replacement
        run: cargo test --locked --lib workspace_recovery::tests::process_kill_during_staging_preserves_candidate_and_allows_reapproved_restore -- --ignored --exact
      - name: Real partial-stage write interruption regression
        run: cargo test --locked --lib workspace_recovery::tests::process_kill_mid_stage_write_keeps_target_and_marker_for_reapproval -- --ignored --exact
      - name: Workspace edit partial-stage interruption regression
        run: cargo test --locked --lib workspace_patch::tests::process_kill_during_partial_staged_apply_preserves_original_source -- --ignored --exact
      - name: Workspace new-file partial-stage interruption regression
        run: cargo test --locked --lib workspace_patch::tests::process_kill_mid_staged_create_preserves_target_absence_and_pending_marker -- --ignored --exact
      - name: Workspace new-file post-publication interruption regression
        run: cargo test --locked --lib workspace_patch::tests::process_kill_after_staged_create_publication_resumes_with_explicit_approval -- --ignored --exact
      - name: Created-file rollback post-deletion process interruption
        run: cargo test --locked --lib workspace_patch::tests::process_kill_after_created_file_rollback_delete_requires_new_approval -- --ignored --exact
      - name: Approved created-file recovery post-deletion process interruption
        run: cargo test --locked --lib workspace_recovery::tests::approved_created_file_recovery_kill_after_delete_requires_fresh_approval -- --ignored --exact
      - name: Workspace rollback partial-stage interruption regression
        run: cargo test --locked --lib workspace_patch::tests::process_kill_mid_rollback_stage_preserves_updated_target_and_marker -- --ignored --exact
      - name: Workspace rollback post-rename interruption regression
        run: cargo test --locked --lib workspace_patch::tests::process_kill_after_rollback_rename_keeps_original_and_recoverable_marker -- --ignored --exact
      - name: Stabilization stress (20 parallel + 20 serial runs)
        shell: bash
        run: |
          set -euo pipefail
          for mode in parallel serial; do
            for attempt in $(seq 1 20); do
              echo "[STRESS] ${mode}: ${attempt}/20"
              if [ "${mode}" = parallel ]; then
                cargo test --locked --test stabilization_flow -- --test-threads=4
              else
                cargo test --locked --test stabilization_flow -- --test-threads=1
              fi
            done
          done
